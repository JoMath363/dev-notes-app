services:
  server:
    build: ./server
    environment:
      ConnectionStrings__WebApiDatabase: "Host=Localhost; Database=${POSTGRES_DB}; Username=${POSTGRES_USER}; Password=${POSTGRES_PASSWORD}"
    ports:
      - "80:8000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:alpine
    container_name: devnotes-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_db:/var/lib/postgresql

volumes:
  postgres_db: